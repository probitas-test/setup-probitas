name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.probitas-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        probitas-version: [latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Probitas
        uses: ./
        id: setup
        with:
          probitas-version: ${{ matrix.probitas-version }}

      - name: Verify Outputs
        shell: bash
        run: |
          echo "Probitas Version: ${{ steps.setup.outputs.probitas-version }}"

      - name: Test Probitas CLI
        run: |
          probitas --version
          probitas --help

      - name: Create Test Scenario
        shell: bash
        run: |
          mkdir -p probitas
          cat > probitas/test.probitas.ts << 'EOF'
          import { scenario } from "@probitas-test/probitas";

          export default scenario("Test Scenario")
            .step("Hello", () => {
              console.log("Hello from Probitas!");
              return { success: true };
            })
            .build();
          EOF

      - name: Run Probitas
        run: probitas run

  # Probitas 1.x is served by setup-probitas@v1; v2 must refuse it clearly.
  rejects-1x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Probitas 1.x
        id: setup
        continue-on-error: true
        uses: ./
        with:
          probitas-version: "1.0.0"

      - name: Expect failure
        if: steps.setup.outcome != 'failure'
        run: |
          echo "setup-probitas@v2 accepted Probitas 1.0.0"
          exit 1
